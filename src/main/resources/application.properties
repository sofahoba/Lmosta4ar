spring.application.name=fullDetailedDemo

# Database Configuration (from environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fullDetails}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:springstudent}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads/case-files}

# Pagination
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.sort.sort-parameter=sort

# Swagger Configuration
# http://localhost:8080/swagger-ui/index.html#/ to access swagger ui
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.fullDetailed.fullDetailedDemo

springdoc.paths-to-match=/api/**
springdoc.show-actuator=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.override-with-generic-response=false

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:youssefehab204@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ethg pgbt ovae fqgi}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# spring batch
spring.batch.jdbc.initialize-schema=${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:always}
spring.batch.job.enabled=${SPRING_BATCH_JOB_ENABLED:false}

# Admin Settings
app.admin.notification-email=${APP_ADMIN_NOTIFICATION_EMAIL:youssefehab20004@gmail.com}

logging.level.root=INFO
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.cache.interceptor=TRACE

spring.aop.auto=${SPRING_AOP_AUTO:true}
spring.aop.proxy-target-class=${SPRING_AOP_PROXY_TARGET_CLASS:true}
server.forward-headers-strategy=framework
springdoc.swagger-ui.use-root-path=true
# ================================
# Logging Configuration
# ================================

# Use environment variable or default to local path
logging.file.name=${LOGGING_FILE_NAME:logs/application.log}

# Make sure these are set
logging.level.com.fullDetailed.fullDetailedDemo=DEBUG
logging.level.com.fullDetailed.fullDetailedDemo.AOP=DEBUG

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# HikariCP Configuration (usually auto-configured, but verify)
